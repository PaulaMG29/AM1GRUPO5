<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap PEI 1</title>
<style>
	:root {
		--ink: #1f2a2e;
		--muted: #5b6d6a;
		--paper: #ffffff;
		--ne: #e8873a;
		--sp: #3a9a4a;
		--gui: #d1453b;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--paper);
		font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
		color: var(--ink);
	}
	#slide {
		position: relative;
		width: 1920px;
		height: 1080px;
		padding: 40px 56px 32px;
		overflow: hidden;
	}
	#links { position: absolute; inset: 0; pointer-events: none; }
	.root {
		position: relative;
		margin: 0 auto;
		width: max-content;
		padding: 14px 34px;
		border-radius: 14px;
		background: #2f4858;
		color: #fff;
		font-size: 30px;
		font-weight: 700;
		letter-spacing: 0.2px;
	}
	.columns {
		display: grid;
		grid-template-columns: 1fr 1fr 1.25fr;
		gap: 70px;
		margin-top: 70px;
	}
	.group-title {
		display: inline-block;
		padding: 9px 22px;
		border-radius: 10px;
		color: #fff;
		font-family: Consolas, "DejaVu Sans Mono", monospace;
		font-size: 25px;
		font-weight: 700;
	}
	.files { margin: 22px 0 0 46px; display: flex; flex-direction: column; gap: 15px; }
	.file { position: relative; }
	.file-name {
		display: inline-block;
		padding: 3px 10px;
		border-radius: 6px;
		background: #f2f4f4;
		border-left: 4px solid var(--c);
		font-family: Consolas, "DejaVu Sans Mono", monospace;
		font-size: 18px;
		font-weight: 700;
	}
	.funcs { margin: 6px 0 0 14px; display: flex; flex-wrap: wrap; gap: 5px 7px; }
	.func {
		padding: 2px 9px;
		border-radius: 999px;
		border: 1.5px solid var(--c);
		color: var(--ink);
		font-family: Consolas, "DejaVu Sans Mono", monospace;
		font-size: 15px;
		background: #fff;
	}
	.func.label { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
</style>
</head>
<body>
<div id="slide">
	<svg id="links"></svg>
	<div class="root" id="root">PEI 1 · Simulador de actitud satelital</div>
	<div class="columns" id="columns"></div>
</div>
<script>
const TREE = [
	{ name: "numerical_engine", color: "var(--ne)", files: [
		["linear_solvers.py", ["partition"]],
		["non_linear_solvers.py", ["our_jacobian", "our_Newton"]],
		["numerical_schemes.py", ["Euler", "RK4", "Crank_Nicolson", "Inverse_Euler"]],
		["Cauchy_problem.py", ["Cauchy_Problem"]],
		["Richardson_error.py", ["estimate_scheme_order", "Richardson_Error"]],
		["numerical_stability_region.py", ["create_mesh", "stability_region"]],
	]},
	{ name: "space_physics", color: "var(--sp)", files: [
		["Euler_equations.py", ["Euler_Equations"]],
		["attitude_equations.py", ["Attitude_Equations", "nearest_rotation"]],
		["kinetic_energy.py", ["T"]],
		["angular_momentum.py", ["L"]],
		["invariants_drift.py", ["invariants_drift"]],
		["equilibrium_espectrum.py", ["equilibrium_spectrum"]],
		["exact_jacobian.py", ["exact_Jacobian"]],
		["separatrix.py", ["separatrix"]],
	]},
	{ name: "gui_reactive", color: "var(--gui)", files: [
		["main.py", ["main"]],
		["app.py", ["SatelliteAttitudeApp"]],
		["config.py", ["SCHEMES", "PAGE_TITLES"]],
		["widgets.py", ["MathLabel", "make_canvas", "make_card", "slider_control"]],
		["helpers.py", ["satellite_model", "shaded_colors", "ellipsoid", "format_spectrum", "latex_sci",
			"error_summary", "stability_map", "amplification_at", "first_invalid", "set_inertias"]],
		["simulation.py", ["run_scheme", "richardson"]],
		["window_initial_conditions.py", ["Ventana 1 · Satélite y Condiciones Iniciales"]],
		["window_numerical_schemes.py", ["Ventana 2 · Esquemas Numéricos"]],
		["window_numerical_integration.py", ["Ventana 3 · Integración numérica"]],
		["window_estimated_error.py", ["Ventana 4 · Error Estimado"]],
	]},
];

const columns = document.getElementById("columns");
for (const group of TREE) {
	const column = document.createElement("div");
	column.style.setProperty("--c", group.color);
	column.innerHTML = `<div class="group-title" style="background:${group.color}">${group.name}</div><div class="files"></div>`;
	const files = column.querySelector(".files");
	for (const [file, funcs] of group.files) {
		const node = document.createElement("div");
		node.className = "file";
		const chips = funcs.map(f => `<span class="func${f.startsWith("Ventana") ? " label" : ""}">${f}</span>`).join("");
		node.innerHTML = `<span class="file-name">${file}</span><div class="funcs">${chips}</div>`;
		files.appendChild(node);
	}
	columns.appendChild(column);
}

// Conexiones curvas: raíz → grupos y grupo → ficheros.
function drawLinks() {
	const svg = document.getElementById("links");
	const slide = document.getElementById("slide").getBoundingClientRect();
	const box = el => { const r = el.getBoundingClientRect(); return { x: r.left - slide.left, y: r.top - slide.top, w: r.width, h: r.height }; };
	const color = el => getComputedStyle(el).getPropertyValue("--c").trim() || "#2f4858";
	let paths = "";
	const root = box(document.getElementById("root"));
	const rx = root.x + root.w / 2, ry = root.y + root.h;
	for (const column of columns.children) {
		const title = column.querySelector(".group-title");
		const stroke = getComputedStyle(title).backgroundColor;
		const g = box(title);
		const gx = g.x + g.w / 2, gy = g.y;
		paths += `<path d="M${rx},${ry} C${rx},${ry + 45} ${gx},${gy - 45} ${gx},${gy}" stroke="${stroke}" stroke-width="4" fill="none"/>`;
		const sx = g.x + 22, sy = g.y + g.h;
		for (const name of column.querySelectorAll(".file-name")) {
			const f = box(name);
			const fy = f.y + f.h / 2;
			paths += `<path d="M${sx},${sy} L${sx},${fy - 14} Q${sx},${fy} ${sx + 14},${fy} L${f.x},${fy}" stroke="${stroke}" stroke-width="2.2" fill="none" opacity="0.85"/>`;
		}
	}
	svg.setAttribute("width", slide.width);
	svg.setAttribute("height", slide.height);
	svg.innerHTML = paths;
}
document.fonts.ready.then(drawLinks);
</script>
</body>
</html>
